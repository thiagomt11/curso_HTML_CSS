<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

    *{
        margin: 0;
        padding: 0;
        font-size: 1em;
        font-family: Arial, Helvetica, sans-serif;
    }

    h1{
        margin: auto;
        text-align: center;
    }

    table{
        width: 500px;
        border-collapse: collapse;
        margin: auto;
        margin-top: 50px;
    }

    thead th{
        padding: 10px;
        background-color: rgba(39, 39, 39, 0.829);
        border: 1px solid black;
        color: white;
    }

    tfoot tr{
        background-color: rgba(39, 39, 39, 0.829);
        border: 1px solid black;
        color: white;
    }

    tfoot tr td{
        padding: 10px;
        border: 1px solid black;
        text-align: center;
    }
    
    tbody td{
        border: 1px solid black;
        text-align: center;
        padding: 5px;
    }

    tbody > tr:nth-child(even){
        background-color: rgb(206, 206, 206);
    }
</style>
<body>
    <h1>Uso de tabelas grandes</h1>

    <table>
        <tbody>
            <tr>
                <td>A</td>
                <td colspan="2">B</td>
            </tr>
            <tr>
                <td rowspan="2">D</td>
                <td>E</td>
                <td>F</td>
            </tr>
            <tr>
                <td>H</td>
                <td>I</td>
            </tr>
            <tr>
                <td>J</td>
                <td>K</td>
                <td>L</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
