<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical de objetos</title>
    <style>
        #container{
            position: relative;
            height: 500px;
            max-width: 500px;
            padding: 10px;
            background-color: purple; 
            background-size: 100% 100%;
            background-position: center center;
        }

        #conteudo{
            position: absolute;
            height: 75%;
            width: 300px;
            background-color: yellow;

            left: 50%;
            top: 50%;

            background-size: 100% 100%;

            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
