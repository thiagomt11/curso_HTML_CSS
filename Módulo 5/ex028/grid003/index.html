<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 002</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding:0;
        }
        
        .container{
            border: 3px solid blue;
            display: grid;
            grid-template: repeat(3,1fr) / repeat(4,1fr);
            grid-auto-flow: column;
            place-items: normal normal;
            place-content: normal normal;
            height: 100vh;
        }

        .item1{
            border: 2px solid red;
            padding: 3px;
            background-color: rgb(255, 206, 206);
            grid-row-start: 1;
            grid-row-end: -4;
            grid-column-start: 1;
            grid-column-end: -1;
        }

        .item2{
            border:2px solid blue;
            padding:3px;
            background-color: rgb(206, 227, 255);
            grid-row-start: 2;
            grid-row-end: -1;
            grid-column-start: 1;
            grid-column-end: -3;
        }

        .item3{
            border:2px solid green;
            padding:3px;
            background-color: rgb(206, 255, 221);
            grid-row: 2 / -1;
            grid-column: 3 / -1; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">A</div>
        <div class="item2">B</div>
        <div class="item3">C</div>
    </div>
</body>
</html>
