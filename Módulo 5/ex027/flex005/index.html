<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex 005</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: rgba(143, 216, 250, 0.7);

        }

        main{
            background-color: darkblue;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }

        section{
            background-color: rgb(8, 0, 77);
            color: white;
            height: 200px;
            width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }

    </style>
</head>
<body>
    <main>
        <section>
            <h1>a</h1>
            <h1>b</h1>
            <h1>c</h1>
            <h1>d</h1>
            <h1>e</h1>
        </section>
    </main>
</body>
</html>
