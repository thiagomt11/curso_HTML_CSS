<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box 010</title>
    <style>
        .container{
            background-color: salmon;
            display: flex;
            flex-flow: row wrap;
        }

        .item{
            background-color: aqua;
            border: 1px solid black;
            padding: 5px;
            text-align: center;
            flex-basis: 200px;
            flex-shrink: 1;
            flex-grow: 0;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
    </div>
</body>
</html>
