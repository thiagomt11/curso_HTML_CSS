<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box 008</title>
    <style>
        .container{
            background-color: salmon;
            display: flex;
            height: 200px;
            align-items: flex-start;
        }

        .item{
            background-color: aqua;
            border: 1px solid black;
            padding: 15px;
            text-align: center;
        }

        #i1{
            align-self: flex-end;
        }
        #i2{
            align-self: center;
        }
        #i3{
            align-self: auto;
        }   
        #i4{
            
        }
        #i5{
            align-self: flex-end;
        }
        #i6{
            align-self: stretch;
        }
        #i7{
        
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
