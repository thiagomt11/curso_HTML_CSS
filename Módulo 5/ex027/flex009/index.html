<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box 009</title>
    <style>
        .container{
            background-color: salmon;
            display: flex;
            flex-flow: row nowrap;
        }

        .item{
            background-color: aqua;
            border: 1px solid black;
            flex: auto;
            padding: 5px;
            text-align: center;

            flex-basis: 100px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">Conteudo grande demais para ocupar tudo</div>
        <div class="item">C</div>
        <div class="item">conteudo normal</div>
        <div class="item">E</div>
        <div class="item">Conteudo</div>
        <div class="item">G</div>
    </div>
</body>
</html>
