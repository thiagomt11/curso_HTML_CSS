<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simbolos e emojis</title>
</head>
<body>
    <h1> Simbolos Especiais</h1>
    <hr>
    <p>Alguns simbolos e emojis especiais que podem ser mostrados aqui, sempre usando um & antes do inicio do texto. <br>Exemplo: <strong>& reg;</strong></p>
    <p>Reg - &reg;</p>
    <p>Copy - &copy;</p>
    <p>Up Arrow -  &uarr;</p>
    <p>Down Arrow - &darr;</p>

    <p> <strong> EMOJIS (sempre iniciando o codigo do emoji com &#x):</strong> 
        <br>&#x1F596;
        <br>&#x1F913;
    </p>
</body>
</html>
