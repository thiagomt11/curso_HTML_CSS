<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
        
        .form{
            gap: 5px;
            border-radius: 5px;
            margin-bottom: 35px;
        }

        .form legend{
            margin: 10px;
            font-size: 1.2em;
            font-weight: bolder;
            padding: 0px 5px;
        }
        .box{
            width: 200px;
            border: 1px solid black;
            border-radius: 5px;
            padding: 5px;
        }

        .submit{
            background-color: black;
            color: white;
            width: 100px;
            padding: 3px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;"> Todos os formularios feitos nos vídeos </h1>

    <form action="cadastro.php" method="post" autocomplete="on">

        <fieldset class="form">
            <legend>Input -> Text e Submit</legend>
            <label for="texto">Usuario: </label><input type="text" name="texto" id="texto" class="box"><br>
            <input type="submit" value="Enviar" class="submit">
        </fieldset>

        <fieldset class="form">
            <legend>Input -> Text c/ restrições, Senhas e Reset</legend>
            <label for="nome">Nome:</label> <input type="text" name="nome" id="nome" required minlength="5" placeholder="Digite seu nome" class="box"><br><br>
            <label for="senha">Senha: </label> <input type="password" name="senha" id="senha" required class="box" placeholder="Digite sua senha"><br>


            <input type="submit" value="Enviar" class="submit">
            <input type="reset" value="Limpar" class="submit">
        </fieldset>

        <fieldset class="form">
            <legend>Input -> Números e Datas</legend>
            <label for="numero">Média: </label> <input type="number" name="numero" id="numero" class="box" min="0" max="10" autocomplete="off"><br><br>
            <label for="mes">Mês: </label> <input type="month" name="mes" id="mes" class="box"> <br><br>
            <label for="data">Data: </label> <input type="date" name="data" id="data" class="box"><br>

            <input type="submit" value="Enviar" class="submit">
            <input type="reset" value="Limpar" class="submit">
        </fieldset>

        <fieldset class="form">
            <legend>Input -> Radio (Seleção Unica) e Checkbox (Seleção Multipla)</legend>
            <input type="radio" name="Sexo" id="sx-masc" value="M"><label for="sx-masc">Masculino</label>
            <input type="radio" name="Sexo" id="sx-fem" value="F"> <label for="sx-fem">Feminino</label><br><br>
            <hr>
           
            <input type="checkbox" name="atvd1" id="atvd1"> <label for="atvd1">Limpar casa</label><br>
            <input type="checkbox" name="atvd2" id="atvd2"> <label for="atvd2">Lavar Roupa</label><br>
            <input type="checkbox" name="atvd3" id="atvd3"> <label for="atvd3">Dobrar Roupas</label><br>
        </fieldset>

        <fieldset class="form">
            <label for="cor">Cor:</label> <input type="color" name="cor" id="cor"><br>
            <label for="nvlsatis">Nivel de Satisfação</label> <input type="range" name="nvlsatis" id="nvlsatis" min="1" max="10"><br><br>

            <input type="file" name="foto" id="foto"><br><br>

            <div>
                <input type="submit" value="Enviar" class="submit">
                <input type="reset" value="Limpar" class="submit">
            </div>
        </fieldset>
    </form>
</body>
</html>
