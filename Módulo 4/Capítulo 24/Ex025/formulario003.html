<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 3</title>
</head>
<body>
    <h1>Teste 3 de Formulários</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <div>
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome" required maxlength="50" placeholder="Digite seu nome completo" autocomplete="name">
        </div>

        <div>
            <label for="media">Média do aluno:</label>
            <input type="number" name="media" id="media" min="0" max="10" placeholder="1 a 10" step="0.5">
        </div>

        <p>
            <label for="data">Data: </label> <input type="date" name="data" id="data"> 
        </p>

        <p><input type="month"></p>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
