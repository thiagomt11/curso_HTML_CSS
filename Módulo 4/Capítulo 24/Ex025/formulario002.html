<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="usuario">Usuário</label>
            <input type="text" name="usuario" id="usuario" required minlength="5" placeholder="Digite o nome do usuário" autocomplete="username">
        </p>

        <p>
            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha" required placeholder="Digite a senha" autocomplete="current-password">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
