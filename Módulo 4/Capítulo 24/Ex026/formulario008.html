<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 8</title>
</head>
<body>
    <h1>Formulario 8</h1>
    <form action="cadastro.php" method="post" autocomplete="on">

        <div>
            Numero 1:
            <input type="number" name="n1" id="n1" oninput="soma.innerHTML = Number(n1.value) + Number(n2.value)">
        </div>

        <div>
            Numero2:
            <input type="number" name="n2" id="n2" oninput="soma.innerHTML = Number(n1.value) + Number(n2.value)">
        </div>

        <div>
            soma: <output name="soma" id="soma"></output>
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>

        <br><br><br>
        Número: <input type="range" name="number" id="number" min="0" max="10" value="5" oninput="valor.innerHTML = Number(number.value)">
        <output id="valor"></output>
    </form>
</body>
</html>
