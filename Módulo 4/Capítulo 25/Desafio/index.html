<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=key_vertical" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=person" />

    <link rel="stylesheet" href="estilos/style.css" media="screen">
    <link rel="stylesheet" href="estilos/tablet.css" media="screen and (min-width:768px) and (max-width:992px)">
    <link rel="stylesheet" href="estilos/desktop.css" media="screen and (min-width:993px)">
    <link rel="stylesheet" href="estilos/tv.css" media="screen and (min-width:1280px)">

</head>
<body>
    <main>

        <section id="login">
            
            <div id="imagem">
                
            </div>
            
            <div id="formulario">
                
                <h1>Login</h1>
                <p>Seja bem-vindo! Faça login para acessar sua conta e poder fazer as confirgurações no seu ambiente.</p>

                <form action="" method="post" autocomplete="on">
                    <div>
                        <label for="i-email" id="person">
                            <span class="material-symbols-outlined">
                                key_vertical
                            </span>
                        </label>
                        <input type="email" name="i-email" id="i-email">
                    </div>
            
                    <div>
                        <label for="i-senha">
                            <span id= "key" class="material-symbols-outlined">
                                key_vertical
                            </span>
                        </label>
                        <input type="password" name="i-senha" id="i-senha">
                    </div>
                    
                    <div>
                        <input type="submit" value="Entrar">
                        <input type="reset" value="Esqueci minha senha">
                    </div>
                
                </form>
            </div>
        </section>
    </main>
</body>
</html>
