<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="stylesheet" href="estilos/style.css" media="screen">
    <link rel="stylesheet" href="estilos/tablet.css" media="screen and (min-width:768px) and (max-width:992px)">
    <link rel="stylesheet" href="estilos/desktop.css" media="screen and (min-width:993px)">
    <link rel="stylesheet" href="estilos/tv.css" media="screen and (min-width:1280px)">

</head>
<body>
    <main>

        <section id="login">
            
            <div id="imagem">
                
            </div>
            
            <div id="formulario">
                
                <h1>Login</h1>
                <p>Seja bem-vindo! Faça login para acessar sua conta e poder fazer as confirgurações no seu ambiente.</p>

                <form action="login.cfm" method="post" autocomplete="on">
                    
                    <div class="box">
                        <label for="i-email" id="person">
                            <span class="material-symbols-outlined">
                                person
                            </span>
                        </label>
                        <input type="email" name="i-email" id="i-email" required minlength="5" maxlength="50" placeholder="Digite seu email"  autocomplete="email">
                    </div>
            
                    <div class="box">
                        <label for="i-senha">
                            <span id= "key" class="material-symbols-outlined">
                                key
                            </span>
                        </label>
                        <input type="password" name="i-senha" id="i-senha" required minlength="5" placeholder="Digite sua senha" autocomplete="current-password">
                    </div>
                    
                    <div>
                        <input type="submit" value="Entrar" id="entrar">
                        <input type="reset" value="Esqueci minha senha" id="esqueci-senha">
                    </div>
                
                </form>
            </div>
        </section>
    </main>
</body>
</html>
